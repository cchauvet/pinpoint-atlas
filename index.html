<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123a4a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pinpoint">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
</head>
<body>
<title>Pinpoint Atlas</title>
<style>
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 400; font-display: swap; src: url(fonts/atkinson-400.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; font-display: swap; src: url(fonts/atkinson-700.woff2) format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; font-display: swap; src: url(fonts/bricolage.woff2) format("woff2"); }
</style>
<style>
/* Layout: one-screen app. Header strip, the map filling the middle, a paper panel docked at the bottom. */
:root {
  --sea: #bdd8e0;
  --sea-line: #a6c8d3;
  --land: #f3ecdb;
  --land-dim: #e4e0d3;
  --edge: #8f9d97;
  --ink: #14313b;
  --muted: #587179;
  --paper: #fbfaf5;
  --line: #dfe4e1;
  --accent: #0f5c73;
  --on-accent: #ffffff;
  --target: #f0a500;
  --good: #2b9660;
  --bad: #d2463c;
  --good-soft: #cfe9d9;
  --bad-soft: #f6d6d0;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0e2731; --sea-line: #173744; --land: #34473f; --land-dim: #273630; --edge: #62786f;
    --ink: #e8f0ee; --muted: #94a9ad; --paper: #12222a; --line: #24404a;
    --accent: #5fc4d9; --on-accent: #06222b; --target: #ffc53d; --good: #4cc488; --bad: #ff6d5f;
    --good-soft: #1f4636; --bad-soft: #4d2925;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0e2731; --sea-line: #173744; --land: #34473f; --land-dim: #273630; --edge: #62786f;
  --ink: #e8f0ee; --muted: #94a9ad; --paper: #12222a; --line: #24404a;
  --accent: #5fc4d9; --on-accent: #06222b; --target: #ffc53d; --good: #4cc488; --bad: #ff6d5f;
  --good-soft: #1f4636; --bad-soft: #4d2925;
  color-scheme: dark;
}

html { height: 100%; box-sizing: border-box; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--paper); color: var(--ink);
  font: 16px/1.4 var(--font-body);
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--target); outline-offset: 2px; }

/* Keep clear of the iPhone notch / Dynamic Island and home bar (all 0 elsewhere). */
#app {
  height: 100%; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* Header */
.bar {
  display: grid; grid-template-columns: 44px 1fr 64px; align-items: center; gap: 8px;
  padding: 8px 12px 6px; background: var(--paper); border-bottom: 1px solid var(--line);
  position: relative; z-index: 2;
}
.icon-btn {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: transparent; display: grid; place-items: center; font-size: 20px; line-height: 1;
}
.icon-btn[hidden] { display: none !important; }
.prompt { text-align: center; min-width: 0; }
.prompt .eyebrow {
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted);
}
.prompt .big {
  font: 800 clamp(20px, 6vw, 28px)/1.1 var(--font-display); letter-spacing: -.01em;
  text-wrap: balance; overflow-wrap: anywhere;
}
.score { text-align: right; font-variant-numeric: tabular-nums; }
.score b { display: block; font: 800 20px/1 var(--font-display); }
.score span { font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress[hidden] { display: none; }
.track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.timer i { background: var(--target); transition: none; }

/* Map */
#mapwrap { flex: 1; position: relative; min-height: 140px; background: var(--paper); overflow: hidden; touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.sphere { fill: var(--sea); stroke: var(--sea-line); stroke-width: 1; }
.grat { fill: none; stroke: var(--sea-line); stroke-width: 1; }
.land { fill: var(--land); stroke: var(--edge); stroke-width: .7; stroke-linejoin: round; transition: fill .2s; }
.land.dim { fill: var(--land-dim); }
.no-borders .land { stroke: var(--land); }
.no-borders .land.dim { stroke: var(--land-dim); }
.land.m-good { fill: var(--good-soft); }
.land.m-bad { fill: var(--bad-soft); }
.land.is-target, .dot.is-target { fill: var(--target); }
.land.is-right, .dot.is-right { fill: var(--good); }
.land.is-wrong, .dot.is-wrong { fill: var(--bad); }
.land.is-pick { fill: var(--accent); }
.dot { fill: var(--land); fill-opacity: .5; stroke: var(--edge); stroke-width: 1; stroke-opacity: .8; }
.dot.dim { fill: var(--land-dim); }
.dot.m-good { fill: var(--good-soft); fill-opacity: .9; }
.dot.m-bad { fill: var(--bad-soft); fill-opacity: .9; }
.dot.is-target, .dot.is-right, .dot.is-wrong, .dot.is-pick { fill-opacity: 1; }
.dot.is-pick { fill: var(--accent); }
.ring { fill: none; stroke: var(--target); stroke-width: 3; }
@keyframes pulse { 0% { opacity: 1; } 100% { opacity: 0; } }

.label {
  position: absolute; left: 0; top: 0; transform: translate(-50%, calc(-100% - 10px));
  padding: 5px 10px; border-radius: 8px; font-weight: 700; font-size: 14px; white-space: nowrap;
  background: var(--ink); color: var(--paper); pointer-events: none;
  box-shadow: 0 4px 14px rgb(0 0 0 / .18);
}
.label::after {
  content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px; margin-left: -5px;
  background: inherit; transform: rotate(45deg);
}
.label.bad { background: var(--bad); color: #fff; }
.label.good { background: var(--good); color: #fff; }
.label.target { background: var(--target); color: #1d1600; }

/* After a wrong tap in Find it: points from the tap toward the right country.
   Anchored to the map, so it follows pans and zooms. */
.arrow {
  position: absolute; left: 0; top: 0; height: 0; transform-origin: 0 0; pointer-events: none;
  filter: drop-shadow(0 0 1.5px var(--ink)) drop-shadow(0 3px 4px rgb(0 0 0 / .25));
}
.arrow::before {
  content: ""; position: absolute; left: -6px; top: -6px; width: 12px; height: 12px;
  border-radius: 50%; background: var(--target);
}
.arrow i {
  position: absolute; left: 0; top: -3px; width: 100%; height: 6px; border-radius: 3px;
  background: var(--target); animation: nudge .9s ease-in-out infinite alternate;
}
.arrow i::after {
  content: ""; position: absolute; right: -16px; top: 50%; transform: translateY(-50%);
  border-left: 18px solid var(--target); border-block: 11px solid transparent;
}
@keyframes nudge { to { transform: translateX(10px); } }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button:disabled { opacity: .4; cursor: default; }
.zoom button {
  width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--paper); font-size: 20px; font-weight: 700; box-shadow: 0 2px 8px rgb(0 0 0 / .12);
}
.toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
  background: var(--ink); color: var(--paper); padding: 6px 14px; border-radius: 999px; font-size: 14px;
  pointer-events: none; transition: opacity .25s; opacity: 0;
  width: max-content; max-width: calc(100% - 32px); text-align: center; text-wrap: balance;
}
.toast.show { opacity: 1; }

/* Panel */
.panel {
  background: var(--paper); border-top: 1px solid var(--line);
  padding: 14px 16px 16px; max-height: 64%; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: 14px; position: relative; z-index: 2;
}
/* The menu scrolls; its Start button stays pinned to the bottom so it is always reachable. */
.dock {
  position: sticky; bottom: -16px; margin-bottom: -16px; padding-block: 10px 16px;
  background: var(--paper); border-top: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px; text-align: center;
}
.panel h2 { margin: 0; font: 800 22px/1.15 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.panel p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group > .lab { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button, .chips button {
  min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent;
  padding: 6px 8px; font-weight: 700; font-size: 15px;
}
.seg button small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.seg button[aria-pressed="true"], .chips button[aria-pressed="true"], .levels button[aria-pressed="true"] {
  border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { min-height: 38px; padding: 4px 12px; font-size: 14px; border-radius: 999px; }

.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.levels button {
  text-align: left; border: 1.5px solid var(--line); background: transparent; border-radius: 14px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.levels b { font: 800 17px/1.2 var(--font-display); display: flex; align-items: center; gap: 8px; }
.levels .pips { display: inline-flex; gap: 3px; }
.levels .pips i { width: 7px; height: 7px; border-radius: 2px; background: var(--line); }
.levels .pips i.on { background: var(--target); }
.levels span { font-size: 12.5px; color: var(--muted); line-height: 1.3; }

.primary {
  min-height: 52px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent);
  font: 800 18px/1 var(--font-display); letter-spacing: .01em; width: 100%;
}
.secondary {
  min-height: 48px; border-radius: 14px; border: 1.5px solid var(--line); background: transparent;
  font-weight: 700; width: 100%;
}
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }

.mastery { display: flex; align-items: center; gap: 12px; }
.mastery .track { height: 8px; border-radius: 4px; }
.mastery .track i { background: var(--good); }
.mastery b { font: 800 18px/1 var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }

.choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.choices button {
  min-height: 52px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent;
  font-weight: 700; padding: 6px 10px; line-height: 1.2; overflow-wrap: anywhere;
}
.choices button.right { background: var(--good); border-color: var(--good); color: #fff; }
.choices button.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); text-decoration: line-through; }
.choices button:disabled { cursor: default; }

.status { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 28px; }
.tries { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--muted); }
.tries i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.tries i.used { background: var(--line); }
.feedback { font-weight: 700; }
.feedback.good { color: var(--good); }
.nowrap { white-space: nowrap; }
.feedback.bad { color: var(--bad); }
.linkish { border: 0; background: transparent; color: var(--accent); font-weight: 700; padding: 8px 4px; min-height: 40px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.stats div { border: 1px solid var(--line); border-radius: 12px; padding: 8px 4px; }
.stats b { display: block; font: 800 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.missed { display: flex; flex-wrap: wrap; gap: 6px; }
.missed button {
  border: 1.5px solid var(--bad); background: var(--bad-soft); border-radius: 999px; padding: 4px 12px;
  min-height: 36px; font-size: 14px; font-weight: 700;
}
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--edge); }
.info { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.info b { font: 800 20px/1.2 var(--font-display); }

@media (min-width: 720px) {
  .levels { grid-template-columns: repeat(4, 1fr); }
  .panel { max-height: 55%; }
  .panel > * { width: 100%; max-width: 760px; margin-inline: auto; }
  .choices { grid-template-columns: repeat(3, 1fr); }
}
@media (orientation: landscape) and (max-height: 520px) {
  #app { flex-direction: row; flex-wrap: wrap; }
  .bar { width: 100%; padding-block: 4px; }
  .progress { display: none; }
  #mapwrap { height: calc(100% - 60px); }
  .panel { width: 46%; max-height: calc(100% - 60px); border-top: 0; border-left: 1px solid var(--line); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>

<div id="app">
  <header class="bar">
    <button class="icon-btn" id="btn-menu" aria-label="Back to menu" hidden>&#x2715;</button>
    <span id="bar-spacer"></span>
    <div class="prompt" id="prompt" aria-live="polite"></div>
    <div class="score" id="score"></div>
    <div class="progress" id="progress" hidden>
      <span id="prog-text">1 / 10</span>
      <div class="track" id="prog-track"><i></i></div>
      <span id="streak"></span>
    </div>
  </header>

  <div id="mapwrap">
    <svg id="map" aria-label="World map"><g id="world"></g></svg>
    <div class="arrow" id="arrow" hidden><i></i></div>
    <div class="label" id="label" hidden></div>
    <div class="toast" id="toast"></div>
    <div class="zoom">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">&minus;</button>
      <button id="zoom-reset" aria-label="Reset view">&#x21BA;</button>
    </div>
  </div>

  <section class="panel" id="panel"></section>
</div>

try {

  if (saved) store = { ...store, ...saved, settings: { ...store.settings, ...saved.settings } };
} catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
const settings = store.settings;
// mastery: m[name] = [timesAsked, firstTryStreak]
function mastery(s) { return store.m[s.n] || [0, 0]; }
function isMastered(s) { return mastery(s)[1] >= 2; }
function record(s, firstTry) {
  const [n, streak] = mastery(s);
  store.m[s.n] = [n + 1, firstTry ? streak + 1 : 0];
}

const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function inRegion(s, region) { return region === 'ALL' || s.regions.includes(region); }

function poolFor(level, region) {
  const all = QUIZ.filter(s => inRegion(s, region));
  let tier = LEVELS[level].maxTier;
  let pool = all.filter(s => s.t <= tier);
  while (pool.length < 8 && tier < 3) { tier++; pool = all.filter(s => s.t <= tier); }
  return pool;
}

const landEls = [], dotEls = [];

// ---------- pan & zoom ----------
let view = { k: 1, x: 0, y: 0 };

const MIN_ZOOM = 0.8, MAX_ZOOM = 60; // relative to the whole-world view

function measure() {

  for (const d of dotList) d.setAttribute('r', r);
  for (const ring of world.querySelectorAll('#fx circle')) ring.setAttribute('r', (+ring.dataset.px) / view.k);

    if (s.b[2] > 150) continue; // skip Russia-sized shapes so Europe stays readable
    if (region === 'OC' && s.c[0] < MAP.w * 0.3) continue; // Samoa etc. sit across the date line

// Touch gestures, all usable with one thumb:
//   drag to pan · double-tap to zoom in · double-tap and slide down/up to zoom in/out

const TAP_DELAY = 260;   // ms to wait for a second tap

function localPoint(clientX, clientY) {
  const r = svg.getBoundingClientRect();

}

svg.addEventListener('pointerdown', e => {

  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      const [ax, ay] = localPoint(pendingTap.x, pendingTap.y);
      cancelPendingTap();
      gesture = { type: 'quickzoom', sy: e.clientY, ax, ay, v: { ...view }, moved: 0 };
    } else {
      flushPendingTap(); // a quick tap somewhere else still counts
      gesture = { type: 'pan', sx: e.clientX, sy: e.clientY, v: { ...view }, moved: 0 };
    }
  } else if (pointers.size === 2) {
    cancelPendingTap();
    const [a, b] = [...pointers.values()];
    gesture = { type: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, v: { ...view } };

function hitTest(clientX, clientY) {

// ---------- direction arrow (Find it, after a wrong tap) ----------
let arrowFrom = null, arrowTo = null; // map point that was tapped, index of the right country
function showArrow(clientX, clientY, i) {
  const [px, py] = localPoint(clientX, clientY);

  const tx = s.c[0] * view.k + view.x, ty = s.c[1] * view.k + view.y;
  // long enough to notice, stopping short of the country when it is close by
  const len = clamp(Math.hypot(tx - fx, ty - fy) - 30, 24, 110);

function kmBetween([lon1, lat1], [lon2, lat2]) {
  const rad = Math.PI / 180;

    Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin((lon2 - lon1) * rad / 2) ** 2;
  const km = 2 * 6371 * Math.asin(Math.sqrt(a));
  return km < 1000 ? Math.max(50, Math.round(km / 50) * 50) : Math.round(km / 100) * 100;

// ---------- floating label & toast ----------
let labelFor = null;

// ---------- header ----------
function setHeader({ eyebrow = '', big = '', score = null, back = false, progress = null }) {
  $('prompt').innerHTML = `<div class="eyebrow">${esc(eyebrow)}</div><div class="big">${esc(big)}</div>`;
  $('score').innerHTML = score == null ? '' : `<b>${score}</b><span>points</span>`;
  $('btn-menu').hidden = !back;
  $('bar-spacer').hidden = back;
  $('progress').hidden = !progress;
  if (progress) {
    $('prog-text').textContent = progress.text;
    $('prog-track').classList.toggle('timer', !!progress.timer);
    $('prog-track').firstElementChild.style.width = (progress.frac * 100) + '%';
    $('streak').textContent = progress.streak ? `${progress.streak} in a row` : '';
  }
}
$('btn-menu').onclick = () => showMenu();

// ---------- map paint states ----------
function paintBase({ region = 'ALL', borders = true, masteryColors = false } = {}) {
  clearMarks('is-target', 'is-right', 'is-wrong', 'is-pick', 'm-good', 'm-bad', 'dim');
  clearRings();
  hideLabel();
  hideArrow();
  svg.classList.toggle('no-borders', !borders);
  for (const s of SHAPES) {
    if (region !== 'ALL' && !s.regions.includes(region)) setClass(s.i, 'dim');
    if (masteryColors && s.t) {
      const [n, streak] = mastery(s);
      if (streak >= 2) setClass(s.i, 'm-good');
      else if (n > 0 && streak === 0) setClass(s.i, 'm-bad');
    }
  }
}

// ---------- quiz round ----------
function zoomTip() {
  if (store.zoomTip2) return;
  store.zoomTip2 = 1; save();
  setTimeout(() => toast('Double-tap to zoom in · double-tap and slide to zoom in or out'), 700);
}
function startRound(list) {
  enterPlay();
  zoomTip();
  const lvl = LEVELS[settings.level];
  const pool = poolFor(settings.level, settings.region);
  let queue = list ? shuffle([...list]) : shuffle([...pool]);
  if (!list && settings.len) queue = queue.slice(0, settings.len);
  game = {
    mode: settings.mode, lvl, pool, queue, i: 0, score: 0, correct: 0, streak: 0, bestStreak: 0,
    missed: [], results: [], practice: !!list,
    box: regionBox(settings.region, pool),
  };
  ask();
}
function ask() {
  const g = game;
  const s = g.queue[g.i];
  g.q = { s, tries: g.lvl.tries, hinted: false, done: false, wrongPicks: [] };
  paintBase({ region: settings.region, borders: g.lvl.borders });
  updateHeader();
  if (g.mode === 'find') {
    renderFindPanel();
    animateTo(homeView(), 450);
  } else {
    setClass(s.i, 'is-target');
    if (Math.max(s.b[2], s.b[3]) < MARKER_LIMIT) pulseRing(s);
    renderNamePanel();
    // show the target with plenty of surroundings so neighbours give context
    const pad = Math.max(s.b[2], s.b[3]) < 40 ? 0.12 : 0.45;
    animateTo(boxView(s.b, pad, 12), 550);
  }
  startTimer();
}
function updateHeader() {
  const g = game, s = g.q.s;
  const label = g.mode === 'find' ? 'Find' : 'Name it';
  setHeader({
    eyebrow: g.practice ? `Practice · ${label}` : `${g.lvl.label} · ${label}`,
    big: g.mode === 'find' ? s.n : 'Which country is yellow?',
    score: g.score, back: true,
    progress: g.lvl.timer && !g.q.done ? null : { text: `${g.i + 1} / ${g.queue.length}`, frac: g.i / g.queue.length, streak: g.streak },
  });
  if (g.lvl.timer && !g.q.done) {
    $('progress').hidden = false;
    $('prog-text').textContent = `${g.i + 1} / ${g.queue.length}`;
    $('streak').textContent = g.streak ? `${g.streak} in a row` : '';
    $('prog-track').classList.add('timer');
  }
}
function triesHtml() {
  const g = game;
  if (g.lvl.tries < 2) return '<span class="tries">One try</span>';
  const used = g.lvl.tries - g.q.tries;
  return `<span class="tries">${Array.from({ length: g.lvl.tries }, (_, n) => `<i class="${n < used ? 'used' : ''}"></i>`).join('')} tries</span>`;
}
function renderFindPanel(feedback = '', kind = '') {
  const g = game;
  $('panel').innerHTML = `
    <div class="status">
      ${triesHtml()}
      ${g.lvl.hint && !g.q.hinted ? '<button class="linkish" id="hint">Hint (half points)</button>' : ''}
    </div>
    <p class="feedback ${kind}" id="fb">${feedback || 'Tap the country on the map. Double-tap to zoom in on small ones.'}</p>
  `;
  const h = $('hint');
  if (h) h.onclick = giveHint;
}
function giveHint() {
  const g = game, s = g.q.s;
  g.q.hinted = true;
  // zoom to a wider neighbourhood around the target, slightly off-centre so it is not given away
  const span = Math.max(s.b[2], s.b[3], 30) * 4;
  const ox = (Math.random() - 0.5) * span * 0.35, oy = (Math.random() - 0.5) * span * 0.25;
  const cx = s.b[0] + s.b[2] / 2 + ox, cy = s.b[1] + s.b[3] / 2 + oy;
  animateTo(boxView([cx - span / 2, cy - span / 2, span, span], 1, 14), 550);
  const region = s.regions.map(r => REGIONS[r]).join(' / ');
  renderFindPanel(`It's in ${region}. Look around the middle of the map.`, '');
}

function onTap(x, y) {
  const g = game;
  const i = hitTest(x, y);
  if (!g || g.mode === 'explore') {
    if (i == null) { hideLabel(); if (g) renderExplore(null); return; }
    const s = SHAPES[i];
    clearMarks('is-pick');
    setClass(i, 'is-pick');
    showLabel(i, s.n);
    if (g) renderExplore(s); else toast(s.n);
    return;
  }
  if (g.mode !== 'find' || g.q.done) {
    if (i != null) showLabel(i, SHAPES[i].n, SHAPES[i] === g.q.s ? 'target' : '');
    return;
  }
  const target = g.q.s;
  const near = screenDistance(target, x, y);
  const forgiving = near.size < 26 && near.d < 14;
  if (i === target.i || forgiving) return answer(true);
  if (i == null) { toast('Tap on a country'); return; }
  // wrong country
  const s = SHAPES[i];
  setClass(i, 'is-wrong');
  showLabel(i, `That's ${s.n}`, 'bad');
  buzz(60);
  g.q.tries--;
  if (g.q.tries > 0) {
    showArrow(x, y, target.i);
    const km = kmBetween(s.g, target.g).toLocaleString('en-US');
    const dir = compassWord(arrowFrom, target.c);
    renderFindPanel(`That's ${esc(s.n)}. ${esc(target.n)} is about <span class="nowrap">${km} km ${dir}</span>. Try again.`, 'bad');
    setTimeout(() => { if (game === g && !g.q.done) setClass(i, 'is-wrong', false); }, 900);
  } else answer(false, s);
}

function renderNamePanel() {
  const g = game, s = g.q.s;
  const opts = shuffle([s, ...distractors(s, g.lvl.choices - 1)]);
  $('panel').innerHTML = `
    <div class="status">${triesHtml()}<span class="small muted">Double-tap the map to zoom</span></div>
    <div class="choices">${opts.map(o => `<button data-i="${o.i}">${esc(o.n)}</button>`).join('')}</div>
    <p class="feedback" id="fb"></p>
  `;
  $('panel').querySelectorAll('.choices button').forEach(b => b.onclick = () => pickName(b));
}
function distractors(s, n) {
  const g = game;
  let cands;
  if (g.lvl.distract === 'pool') {
    cands = shuffle(g.pool.filter(o => o !== s));
    if (cands.length < n) cands = cands.concat(shuffle(QUIZ.filter(o => o !== s && !cands.includes(o))));
  } else if (g.lvl.distract === 'region') {
    cands = shuffle(QUIZ.filter(o => o !== s && o.t <= 2 && o.regions.some(r => s.regions.includes(r))));
  } else {
    // nearest neighbours, so the choices all sit around the same spot on the map
    cands = QUIZ.filter(o => o !== s)
      .map(o => ({ o, d: Math.hypot(o.c[0] - s.c[0], o.c[1] - s.c[1]) }))
      .sort((a, b) => a.d - b.d).slice(0, n + 4).map(x => x.o);
    cands = shuffle(cands);
  }
  if (cands.length < n) cands = cands.concat(shuffle(QUIZ.filter(o => o !== s && !cands.includes(o))));
  return cands.slice(0, n);
}
function pickName(btn) {
  const g = game;
  if (g.q.done) return;
  const i = +btn.dataset.i;
  if (i === g.q.s.i) { btn.classList.add('right'); return answer(true); }
  btn.classList.add('wrong');
  btn.disabled = true;
  buzz(60);
  // show where the wrong pick actually is
  setClass(i, 'is-wrong');
  showLabel(i, SHAPES[i].n, 'bad');
  g.q.tries--;
  if (g.q.tries > 0) {
    $('panel').querySelector('.status').firstElementChild.outerHTML = triesHtml();
    $('fb').className = 'feedback bad';
    $('fb').textContent = `No, ${SHAPES[i].n} is the red one. Try again.`;
  } else answer(false, SHAPES[i]);
}

function answer(ok, wrongShape) {
  const g = game, q = g.q, s = q.s;
  q.done = true;
  hideArrow();
  stopTimer();
  const triesUsed = g.lvl.tries - q.tries + (ok ? 1 : 0);
  const firstTry = ok && triesUsed === 1 && !q.hinted;
  record(s, firstTry);
  let pts = 0;
  if (ok) {
    pts = [100, 50, 25][triesUsed - 1] || 25;
    if (q.hinted) pts = Math.round(pts / 2);
    if (g.lvl.timer) pts += Math.round(timeLeft() * 10);
    g.score += pts; g.correct++; g.streak++;
    g.bestStreak = Math.max(g.bestStreak, g.streak);
  } else {
    g.streak = 0;
    g.missed.push(s);
  }
  g.results.push({ s, ok });
  save();
  clearMarks('is-target');
  setClass(s.i, ok ? 'is-right' : 'is-target');
  if (Math.max(s.b[2], s.b[3]) < MARKER_LIMIT) pulseRing(s);
  showLabel(s.i, s.n, ok ? 'good' : 'target');
  if (!ok) buzz([40, 60, 40]);
  updateHeader();
  const last = g.i === g.queue.length - 1;
  const msg = ok
    ? `${['Correct!', 'Nice one!', 'Spot on!', 'Yes!'][Math.random() * 4 | 0]} +${pts}`
    : (wrongShape === null ? `Time's up. That's ${s.n}.` : `The answer was ${s.n}.`);
  const choicesHtml = g.mode === 'name' ? $('panel').querySelector('.choices') : null;
  if (choicesHtml) {
    choicesHtml.querySelectorAll('button').forEach(b => {
      b.disabled = true;
      if (+b.dataset.i === s.i) b.classList.add('right');
    });
  }
  const panel = $('panel');
  const keep = choicesHtml ? choicesHtml.outerHTML : '';
  panel.innerHTML = `
    ${keep}
    <div class="status">
      <span class="feedback ${ok ? 'good' : 'bad'}">${esc(msg)}</span>
      <span class="small muted">${esc(s.regions.map(r => REGIONS[r]).join(' · '))}</span>
    </div>
    <button class="primary" id="next">${last ? 'See results' : 'Next'}</button>
  `;
  $('next').onclick = next;
  if (!ok) {
    // fly to the answer so the player sees where it really is
    const pad = Math.max(s.b[2], s.b[3]) < 40 ? 0.15 : 0.5;
    animateTo(boxView(s.b, pad, 12), 650);
  }
  if (ok) {
    g.autoNext = setTimeout(() => { if (game === g && g.q === q) next(); }, g.mode === 'name' ? 1100 : 1300);
  }
}
function next() {
  const g = game;
  if (!g) return;
  clearTimeout(g.autoNext);
  if (g.i >= g.queue.length - 1) return finish();
  g.i++;
  ask();
}

// ---------- timer (Expert) ----------
let timer = null, timerStart = 0;
function startTimer() {
  stopTimer();
  const g = game;
  if (!g.lvl.timer) return;
  timerStart = performance.now();
  const bar = $('prog-track').firstElementChild;
  const tick = () => {
    if (!game || game !== g || g.q.done) return;
    const left = timeLeft();
    bar.style.width = (left / g.lvl.timer * 100) + '%';
    if (left <= 0) { g.q.tries = 0; answer(false, null); return; }
    timer = requestAnimationFrame(tick);
  };
  timer = requestAnimationFrame(tick);
}
function stopTimer() { cancelAnimationFrame(timer); timer = null; }
function timeLeft() { return game && game.lvl.timer ? Math.max(0, game.lvl.timer - (performance.now() - timerStart) / 1000) : 0; }

// ---------- results ----------
function finish() {
  const g = game;
  stopTimer();
  const total = g.queue.length;
  const key = [g.mode, settings.level, settings.region, settings.len].join('|');
  const prevBest = store.best[key];
  const newBest = !g.practice && (prevBest == null || g.score > prevBest);
  if (newBest) { store.best[key] = g.score; save(); }
  const pct = Math.round(g.correct / total * 100);
  const verdict = pct === 100 ? 'Perfect round!' : pct >= 80 ? 'Great work!' : pct >= 50 ? 'Getting there.' : 'Keep practising.';
  setHeader({ eyebrow: g.practice ? 'Practice complete' : `${g.lvl.label} round complete`, big: verdict, score: g.score, back: true });
  // paint the round on the map: green for right, red for missed
  paintBase({ region: settings.region });
  for (const r of g.results) setClass(r.s.i, r.ok ? 'is-right' : 'is-wrong');
  const missed = [...new Set(g.missed)];
  $('panel').innerHTML = `
    <div class="stats">
      <div><b>${g.correct}/${total}</b><span>Correct</span></div>
      <div><b>${pct}%</b><span>Accuracy</span></div>
      <div><b>${g.bestStreak}</b><span>Best streak</span></div>
    </div>
    ${newBest ? `<p class="feedback good">New best score for this set: ${g.score}</p>` : prevBest != null && !g.practice ? `<p class="small muted">Best for this set: ${prevBest}</p>` : ''}
    ${missed.length ? `
      <div class="group">
        <span class="lab">Missed (tap to see where)</span>
        <div class="missed">${missed.map(s => `<button data-i="${s.i}">${esc(s.n)}</button>`).join('')}</div>
      </div>` : ''}
    <div class="row">
      ${missed.length ? `<button class="primary" id="practice">Practice ${missed.length} missed</button>` : ''}
      <button class="${missed.length ? 'secondary' : 'primary'}" id="again">Play again</button>
    </div>
    <button class="secondary" id="menu">Menu</button>
  `;
  $('panel').querySelectorAll('.missed button').forEach(b => b.onclick = () => {
    const s = SHAPES[+b.dataset.i];
    showLabel(s.i, s.n, 'bad');
    if (Math.max(s.b[2], s.b[3]) < MARKER_LIMIT) pulseRing(s); else clearRings();
    animateTo(boxView(s.b, Math.max(s.b[2], s.b[3]) < 40 ? 0.15 : 0.5, 12), 550);
  });
  animateTo(homeView(), 500);
  if (missed.length) $('practice').onclick = () => startRound(missed);
  $('again').onclick = () => startRound();
  $('menu').onclick = () => showMenu();
}

// ---------- boot ----------
function onResize() {
  const old = { ...size }, oldFit = kFit, v = view;
  measure();
  if (old.w === size.w && old.h === size.h) return;
  cancelAnimationFrame(anim);
  if (Math.abs(v.k / oldFit - 1) < 0.03) apply(game && game.box ? homeView() : fitView());
  else if (old.w > 1) {
    // keep the same map point centred after rotation / resize
    const cx = (old.w / 2 - v.x) / v.k, cy = (old.h / 2 - v.y) / v.k;
    const k = v.k * Math.min(size.w / old.w, size.h / old.h) || v.k;
    apply({ k: Math.max(k, kFit), x: size.w / 2 - cx * k, y: size.h / 2 - cy * k });
  } else apply(fitView());
}
new ResizeObserver(onResize).observe(wrap);
measure();
apply(fitView());
showMenu();
</script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
